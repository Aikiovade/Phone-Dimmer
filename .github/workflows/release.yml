name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional: add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD as repository secrets to publish a signed APK. Without
      # them the release stays unsigned and the installable debug APK is
      # attached instead. See the README for how to create the secrets.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "Signing keystore written to release-keystore.jks"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret, the release will be unsigned"
          fi

      - name: Build release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Pick the APK to publish
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=NightDimmer-${{ github.ref_name }}.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=NightDimmer-${{ github.ref_name }}-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || echo "Release already exists, updating its assets instead"
          gh release upload "${{ github.ref_name }}" "${{ steps.apk.outputs.name }}" --clobber
